name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check core agents playbooks tests || true
      - name: Pytest
        env:
          CF_CONTAINMENT_LIVE: "false"
          CF_ALLOW_FORCE: "false"
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short
      - name: Bandit
        run: bandit -q -r core agents -x tests || true
      - name: pip-audit
        run: pip-audit -r requirements.txt || true
      - name: Audit chain script present
        run: test -f scripts/verify_audit_chain.py
