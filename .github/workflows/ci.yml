name: CI

# Blocking pipeline — no || true on required security/quality steps.
# Supported runtime: Python 3.12 on Linux (Ubuntu for CI; pilot VMs: Debian/Ubuntu).
# Live containment is forced off in CI.

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Prefer immutable SHAs in locked-down orgs; tags documented for readability.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit pytest

      - name: No failure-suppression in quality gate
        run: |
          if grep -nE '\|\|\s*true' scripts/quality_check.sh scripts/defense_check.sh 2>/dev/null | grep -v 'chmod'; then
            echo "Blocking: quality/defense scripts must not suppress failures with || true"
            exit 1
          fi
          echo "OK: no failure suppression in quality/defense gates"

      - name: Ruff (blocking)
        run: ruff check core agents playbooks tests

      - name: Pytest (blocking)
        env:
          CF_CONTAINMENT_LIVE: "false"
          CF_ALLOW_FORCE: "false"
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short

      - name: Bandit (blocking on HIGH/MEDIUM)
        run: bandit -q -r core agents -x tests -ll

      - name: pip-audit (blocking)
        run: pip-audit -r requirements.txt

      - name: Audit chain script present
        run: test -f scripts/verify_audit_chain.py

      - name: Defense posture script
        run: bash scripts/defense_check.sh

      - name: Document supported platform
        run: |
          echo "Supported CI OS: ubuntu-latest"
          echo "Supported Python: 3.12"
          echo "Pilot targets: Linux with CAP_NET_ADMIN for live firewall only"
