name: CI

# Blocking pipeline — no || true on required security/quality steps.
# Supported runtime: Python 3.12 on Linux (Ubuntu for CI; pilot VMs: Debian/Ubuntu).
# Live containment is forced off in CI.

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Prefer immutable SHAs in locked-down orgs; tags documented for readability.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit pytest
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables rsync

      - name: No failure-suppression in quality gate
        run: |
          if grep -nE '\|\|\s*true' scripts/quality_check.sh scripts/defense_check.sh 2>/dev/null | grep -v 'chmod'; then
            echo "Blocking: quality/defense scripts must not suppress failures with || true"
            exit 1
          fi
          echo "OK: no failure suppression in quality/defense gates"

      - name: Ruff (blocking)
        run: ruff check core agents playbooks tests

      - name: Pytest (blocking)
        env:
          CF_CONTAINMENT_LIVE: "false"
          CF_ALLOW_FORCE: "false"
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short

      - name: Bandit (blocking on HIGH/MEDIUM)
        run: bandit -q -r core agents -x tests -ll

      - name: pip-audit (blocking)
        run: pip-audit -r requirements.txt

      - name: Audit and acceptance script syntax
        run: |
          test -f scripts/verify_audit_chain.py
          bash -n scripts/firewall_namespace_acceptance.sh
          bash -n scripts/backup_offbox.sh
          bash -n scripts/restore_offbox.sh
          bash -n scripts/backup_restore_acceptance.sh
          bash -n scripts/check_netadmin.sh
          bash -n scripts/disable_live_mode.sh
          bash -n scripts/enable_live_mode.sh
          bash -n scripts/pilot_vm_preflight.sh
          bash -n scripts/check_client_ready.sh
          bash -n start.sh
          bash -n stop.sh
          bash -n scripts/process_lifecycle_safety.sh
          bash -n install.sh
          bash -n scripts/defense_check.sh
          bash -n scripts/quality_check.sh

      - name: Process lifecycle safety regression
        run: bash scripts/process_lifecycle_safety.sh

      - name: Defense posture script
        run: bash scripts/defense_check.sh

      - name: Isolated firewall namespace acceptance
        run: |
          sudo bash scripts/firewall_namespace_acceptance.sh

      - name: Backup and recovery acceptance
        run: bash scripts/backup_restore_acceptance.sh

      - name: Deployment profile safety
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          compose = yaml.safe_load(Path("docker/docker-compose.yml").read_text())
          services = compose["services"]
          firewall = services["firewall"]
          assert "cap_add" not in firewall, "standard Docker profile must not receive NET_ADMIN"
          for name, service in services.items():
              for value in service.get("environment", []):
                  if isinstance(value, str) and value.startswith("CF_CONTAINMENT_LIVE="):
                      assert value == "CF_CONTAINMENT_LIVE=false", f"{name} can arm live containment in standard Docker profile"
          start = Path("start.sh").read_text()
          assert "TERMUX_VERSION" in start and "PROOT_TMP_DIR" in start
          assert 'export CF_CONTAINMENT_LIVE=false' in start
          print("PASS: Docker and Termux/proot profiles are monitoring-only")
          PY

      - name: Document supported platform
        run: |
          echo "Supported CI OS: ubuntu-latest"
          echo "Supported Python: 3.12"
          echo "Pilot targets: Linux with CAP_NET_ADMIN for live firewall only"
