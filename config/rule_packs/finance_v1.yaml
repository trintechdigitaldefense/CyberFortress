pack_id: finance_v1
version: "1.1"
description: "Finance / credit union — privileged access, data exfil, BEC signals"
sector: finance
rules:
  - id: CF-FIN-001
    name: privileged_abuse
    match_indicators: [privileged, domain_admin, golden_ticket, dcsync]
    severity: CRITICAL
    playbook: isolate_endpoint
  - id: CF-FIN-002
    name: data_exfil
    match_indicators: [exfil, large_transfer, cloud_sync_burst, dns_tunnel]
    severity: CRITICAL
    playbook: block_ip
  - id: CF-FIN-003
    name: phishing_finance
    match_indicators: [phishing, bce, business_email_compromise, wire_fraud]
    severity: HIGH
    playbook: block_ip
  - id: CF-FIN-004
    name: ransomware
    match_indicators: [ransomware, encryption, shadow_copy_delete]
    severity: CRITICAL
    playbook: halt_operations
  - id: CF-FIN-005
    name: vpn_bruteforce
    match_indicators: [vpn, bruteforce, password_spray, failed_login]
    severity: HIGH
    playbook: block_ip
  - id: CF-FIN-006
    name: c2_beacon
    match_indicators: [c2, beacon, reverse_shell, cobalt]
    severity: CRITICAL
    playbook: isolate_endpoint
  - id: CF-FIN-007
    name: credential_dump
    match_indicators: [mimikatz, credential_dump, lsass, secretsdump]
    severity: CRITICAL
    playbook: isolate_endpoint
