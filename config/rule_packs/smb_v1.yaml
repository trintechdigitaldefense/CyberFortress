pack_id: smb_v1
version: "1.1"
description: "SMB / small business — RDP, phishing, ransomware, POS-adjacent"
sector: smb
rules:
  - id: CF-SMB-001
    name: rdp_bruteforce
    match_indicators: [rdp, bruteforce, smb_bruteforce, failed_login_flood, password_spray]
    severity: HIGH
    playbook: block_ip
  - id: CF-SMB-002
    name: phishing_callback
    match_indicators: [phishing, callback, malware, macro]
    severity: HIGH
    playbook: isolate_endpoint
  - id: CF-SMB-003
    name: decoy_trip
    match_indicators: [decoy, honeypot, mirage_trip]
    severity: HIGH
    playbook: isolate_endpoint
  - id: CF-SMB-004
    name: ransomware
    match_indicators: [ransomware, encryption, exfil, shadow_copy_delete]
    severity: CRITICAL
    playbook: halt_operations
  - id: CF-SMB-005
    name: reverse_shell
    match_indicators: [reverse_shell, shell, c2, beacon]
    severity: HIGH
    playbook: block_ip
  - id: CF-SMB-006
    name: suspicious_admin
    match_indicators: [new_admin, privilege_escalation, sudo_abuse]
    severity: HIGH
    playbook: terminate_session
  - id: CF-SMB-007
    name: port_scan
    match_indicators: [port_scan, recon, network_scan]
    severity: HIGH
    playbook: block_ip
