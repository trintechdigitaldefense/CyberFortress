version: "3.8"

services:
  threat_agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_threat_agent
    restart: unless-stopped
    volumes:
      - ../config:/app/config:ro
      - ../logs:/app/logs
      - ../telemetry:/app/telemetry
    environment:
      - CF_MODE=production
      - CF_LOG_LEVEL=INFO
    networks:
      - cyberfortress_net

  compliance_logger:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_compliance_logger
    restart: unless-stopped
    command: ["python3", "-m", "agents.compliance_logger"]
    volumes:
      - ../config:/app/config:ro
      - ../logs:/app/logs
    environment:
      - CF_MODE=production
    networks:
      - cyberfortress_net

  fusion_agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_fusion_agent
    restart: unless-stopped
    command: ["python3", "-m", "agents.telemetry_fusion_agent"]
    volumes:
      - ../config:/app/config:ro
      - ../logs:/app/logs
      - ../telemetry:/app/telemetry
    environment:
      - CF_MODE=production
      - CF_LOG_LEVEL=INFO
    networks:
      - cyberfortress_net

  watchdog:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_watchdog
    restart: unless-stopped
    command: ["python3", "-m", "agents.watchdog_agent"]
    volumes:
      - ../config:/app/config:ro
      - ../logs:/app/logs
    environment:
      - CF_MODE=production
      - CF_WATCHDOG_INTERVAL=60
      - CF_WATCHDOG_FAIL_CLOSED=${CF_WATCHDOG_FAIL_CLOSED:-false}
    networks:
      - cyberfortress_net

  whatsapp_webhook:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_whatsapp_webhook
    restart: unless-stopped
    command: ["python3", "-m", "agents.whatsapp_webhook"]
    ports:
      - "8089:8089"
    volumes:
      - ../logs:/app/logs
    environment:
      - CF_WHATSAPP_VERIFY_TOKEN=${CF_WHATSAPP_VERIFY_TOKEN:-cf_verify_token_change_me}
      - CF_WHATSAPP_PENDING_DIR=/app/logs/whatsapp_pending
      - CF_WHATSAPP_WEBHOOK_PORT=8089
    networks:
      - cyberfortress_net

  health:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_health
    restart: unless-stopped
    command: ["python3", "-m", "agents.healthcheck", "--serve"]
    ports:
      - "8090:8090"
    volumes:
      - ../logs:/app/logs
      - ../evidence:/app/evidence
      - ../secrets:/app/secrets
    environment:
      - CF_HEALTH_PORT=8090
    networks:
      - cyberfortress_net

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_dashboard
    restart: unless-stopped
    command: ["python3", "-m", "agents.dashboard"]
    ports:
      - "8091:8091"
    volumes:
      - ../logs:/app/logs
      - ../evidence:/app/evidence
    environment:
      - CF_DASHBOARD_PORT=8091
      - CF_AUDIT_PATH=/app/logs/cma_audit.jsonl
      - CF_WHATSAPP_PENDING_DIR=/app/logs/whatsapp_pending
    networks:
      - cyberfortress_net

networks:
  cyberfortress_net:
    driver: bridge
