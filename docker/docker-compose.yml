# CyberFortress — Docker Compose (parity with local start.sh)
# Defaults: containment LIVE=false, fail-closed watchdog, localhost binds

services:
  threat_agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_threat_agent
    restart: unless-stopped
    user: "10001:10001"
    command: ["python3", "-m", "agents.threat_hunting_agent"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../config:/app/config:ro
      - ../logs:/app/logs
      - ../telemetry:/app/telemetry
    environment:
      - CF_MODE=production
      - CF_CONTAINMENT_LIVE=${CF_CONTAINMENT_LIVE:-false}
      - CF_ALLOW_FORCE=${CF_ALLOW_FORCE:-false}
      - CF_AUTO_RESPOND=${CF_AUTO_RESPOND:-true}
      - CF_AUDIT_PATH=/app/logs/cma_audit.jsonl
    networks:
      - cyberfortress_net

  fusion_agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_fusion_agent
    restart: unless-stopped
    user: "10001:10001"
    command: ["python3", "-m", "agents.telemetry_fusion_agent"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../config:/app/config:ro
      - ../logs:/app/logs
      - ../telemetry:/app/telemetry
    environment:
      - CF_AUTO_RESPOND=${CF_AUTO_RESPOND:-true}
      - CF_AUDIT_PATH=/app/logs/cma_audit.jsonl
      - CF_CONTAINMENT_LIVE=${CF_CONTAINMENT_LIVE:-false}
    networks:
      - cyberfortress_net

  compliance:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_compliance_logger
    restart: unless-stopped
    user: "10001:10001"
    command: ["python3", "-m", "agents.compliance_logger"]
    volumes:
      - ../logs:/app/logs
    environment:
      - CF_AUDIT_PATH=/app/logs/cma_audit.jsonl
    networks:
      - cyberfortress_net

  watchdog:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_watchdog
    restart: unless-stopped
    user: "10001:10001"
    command: ["python3", "-m", "agents.watchdog_agent"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../logs:/app/logs
    environment:
      - CF_WATCHDOG_INTERVAL=60
      - CF_WATCHDOG_FAIL_CLOSED=${CF_WATCHDOG_FAIL_CLOSED:-true}
      - CF_CONTAINMENT_LIVE=${CF_CONTAINMENT_LIVE:-false}
    networks:
      - cyberfortress_net

  firewall:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_firewall
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["python3", "-m", "agents.firewall_agent"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../logs:/app/logs
    environment:
      - CF_CONTAINMENT_LIVE=${CF_CONTAINMENT_LIVE:-false}
      - CF_FIREWALL_AUTO_START=${CF_FIREWALL_AUTO_START:-true}
    networks:
      - cyberfortress_net

  whatsapp_webhook:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_whatsapp_webhook
    restart: unless-stopped
    user: "10001:10001"
    command: ["python3", "-m", "agents.whatsapp_webhook"]
    ports:
      - "127.0.0.1:8089:8089"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../logs:/app/logs
    environment:
      - CF_WHATSAPP_VERIFY_TOKEN=${CF_WHATSAPP_VERIFY_TOKEN:-cf_verify_token_change_me}
      - CF_WHATSAPP_PENDING_DIR=/app/logs/whatsapp_pending
      - CF_WHATSAPP_WEBHOOK_PORT=8089
    networks:
      - cyberfortress_net

  daily_report:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_daily_report
    restart: unless-stopped
    user: "10001:10001"
    command: ["python3", "-m", "agents.daily_report_agent"]
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../logs:/app/logs
      - ../evidence:/app/evidence
    environment:
      - CF_REPORT_INTERVAL_SECONDS=${CF_REPORT_INTERVAL_SECONDS:-86400}
      - CF_REPORT_ON_START=${CF_REPORT_ON_START:-true}
      - CF_AUDIT_PATH=/app/logs/cma_audit.jsonl
    networks:
      - cyberfortress_net

  health:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_health
    restart: unless-stopped
    user: "10001:10001"
    command: ["python3", "-m", "agents.healthcheck", "--serve"]
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../logs:/app/logs
      - ../evidence:/app/evidence
      - ../secrets:/app/secrets
    environment:
      - CF_HEALTH_PORT=8090
      - CF_CONTAINMENT_LIVE=${CF_CONTAINMENT_LIVE:-false}
    networks:
      - cyberfortress_net

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cf_dashboard
    restart: unless-stopped
    user: "10001:10001"
    command: ["python3", "-m", "agents.dashboard"]
    ports:
      - "127.0.0.1:8091:8091"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../logs:/app/logs
      - ../evidence:/app/evidence
      - ../config:/app/config:ro
    environment:
      - CF_DASHBOARD_PORT=8091
      - CF_AUDIT_PATH=/app/logs/cma_audit.jsonl
      - CF_WHATSAPP_PENDING_DIR=/app/logs/whatsapp_pending
      - CF_CONTAINMENT_LIVE=${CF_CONTAINMENT_LIVE:-false}
    networks:
      - cyberfortress_net

networks:
  cyberfortress_net:
    driver: bridge
